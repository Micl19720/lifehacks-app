name: Build APK

# Сборка запускается автоматически при загрузке файлов или вручную (Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks -storepass lifehacks2026 \
            -keypass lifehacks2026 -alias lifehacks -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Lifehacks, OU=Dev, O=Lifehacks, L=Moscow, C=RU"
          echo "storeFile=release.jks" > keystore.properties
          echo "storePassword=lifehacks2026" >> keystore.properties
          echo "keyAlias=lifehacks" >> keystore.properties
          echo "keyPassword=lifehacks2026" >> keystore.properties

      - name: Build release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          gradle assembleRelease

      - name: Upload APK + keystore
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/release.jks
